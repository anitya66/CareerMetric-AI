spring.application.name=career-metric-ai

server.port=8080


# =========================================================
# MySQL - Application Database
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/careermetric
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# =========================================================
# Google Authentication
# =========================================================

google.client-id=${GOOGLE_CLIENT_ID}


# =========================================================
# Resume Storage
# =========================================================

app.storage.resume-dir=storage/resumes

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


# =========================================================
# Spring AI - Model Provider Selection
# =========================================================
# Groq (OpenAI-compatible API) -> Chat / LLM
# Ollama -> Embeddings

spring.ai.model.chat=openai
spring.ai.model.embedding=ollama


# =========================================================
# Groq - Chat / LLM
# =========================================================

spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=openai/gpt-oss-20b
spring.ai.openai.chat.reasoning-effort=low



# =========================================================
# Ollama - Embeddings
# =========================================================

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=mxbai-embed-large


# =========================================================
# PostgreSQL - PGVector
# =========================================================
# PostgreSQL is used only for vector storage / semantic search.
# MySQL remains the primary transactional database.

pgvector.datasource.jdbc-url=jdbc:postgresql://localhost:5432/postgres
pgvector.datasource.username=${PGVECTOR_DB_USERNAME}
pgvector.datasource.password=${PGVECTOR_DB_PASSWORD}
pgvector.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# PGVector Auto-Configuration
# =========================================================
# We configure the PGVector VectorStore manually because
# MySQL is the application's primary datasource.

spring.ai.vectorstore.type=custom